<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>현장실습 기업 참여 안내</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<style>
/* 색: 흰 바탕, 연한 파랑 표, 하늘색 버튼, 로고 파랑 강조(상단 가는 줄만 로고 노랑). 밝은 화면 한 가지로 고정. Layout: 로고가 있는 흰 상단 바 아래 단일 열. 문항 4개를 한 화면에 두고, 결과는 문항 바로 아래 카드로 보여줍니다. 색은 로고의 파랑과 노랑에서 가져옵니다. */
:root {
  color-scheme: light;
  --bg: #ffffff;
  --surface: #f1f6fd;
  --opt: #ffffff;
  --ink: #1a2433;
  --muted: #55627a;
  --line: #d3dff0;
  --accent: #0a4a9b;
  --accent-ink: #ffffff;
  --accent-soft: #e8f0fb;
  --gold: #fcaf17;
  --btn: #0a4a9b;
  --btn-ink: #ffffff;
  --tag-bg: #d3eafb;
  --ok: #1d7a46;
  --ok-soft: #e3f4ea;
  --ok-ink: #ffffff;
  --no: #8a3b00;
  --no-soft: #fff1e0;
  --no-line: #eab97c;
  --bar: #ffffff;
  --bar-ink: #142030;
  --bar-line: #e3e8ee;
  --font-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}

* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.6; }

.bar { border-top: 12px solid var(--accent); background: var(--bar); color: var(--bar-ink); border-bottom: 1px solid var(--bar-line); }
.bar-in { max-width: 680px; margin-inline: auto; padding-inline: 16px; padding-block: 12px; display: flex; align-items: center; gap: 14px; }
.mascot { height: 50px; width: auto; display: block; margin-right: -6px; }
.logo { height: 38px; width: auto; display: block; }
.bar-name { font-size: 14px; font-weight: 500; color: #3b4a5a; padding-left: 14px; border-left: 1px solid var(--bar-line); line-height: 1.3; }

.bar-link { margin-left: auto; flex: none; display: inline-flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 700; color: #fff; background: var(--accent); border: 1px solid var(--accent); border-radius: 6px; padding: 8px 14px; text-decoration: none; white-space: nowrap; }
.bar-link span { color: #8cc8f5; font-weight: 400; }
.bar-link:hover { filter: brightness(1.12); }
.bar-link:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.wrap { max-width: 680px; margin-inline: auto; padding-inline: 16px; padding-block: 28px 64px; display: grid; gap: 20px; }
h1 { margin: 0 0 8px; font-size: 28px; line-height: 1.25; font-weight: 700; text-wrap: balance; }
h2 { margin: 0; font-size: 20px; line-height: 1.35; }
.lede { margin: 0; color: var(--muted); max-width: 54ch; }

.sheet { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; }
fieldset { border: 0; margin: 0; padding: 22px 20px 20px; min-width: 0; display: grid; gap: 12px; }
fieldset + fieldset { border-top: 1px solid var(--line); }
legend { padding: 0; float: left; width: 100%; margin-bottom: 4px; }
legend + * { clear: both; }
.qn { display: block; font-family: var(--font-mono); font-size: 12px; color: var(--muted); letter-spacing: 0.04em; }
.qt { display: block; font-size: 17px; font-weight: 700; line-height: 1.4; }
.qhint { margin: 0; font-size: 13.5px; color: var(--muted); }

.opts { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; }
.opt { position: relative; display: flex; align-items: center; gap: 10px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 6px; cursor: pointer; background: var(--opt); min-width: 0; }
.opt:hover { border-color: var(--accent); }
.opt input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
.mark { flex: none; width: 22px; height: 22px; border: 2px solid var(--muted); border-radius: 50%; display: grid; place-items: center; }

.opt:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
.opt:has(input:checked) .mark { border-color: transparent; }
.opt:has(input:checked) .mark::after { transform: scale(1); }
.opt:has(input:focus-visible) { outline: 3px solid var(--accent); outline-offset: 2px; }
.opt:has(input:disabled) { opacity: 0.5; cursor: not-allowed; background: var(--surface); }
.opt:has(input:disabled):hover { border-color: var(--line); }
.opt input:disabled { cursor: not-allowed; }
.olabel { font-weight: 500; overflow-wrap: anywhere; }

.actions { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; padding: 16px 20px; border-top: 1px solid var(--line); }
.progress { margin: 0; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.btn { font: inherit; font-weight: 700; border: 1px solid var(--btn); background: var(--btn); color: var(--btn-ink); border-radius: 6px; padding: 11px 22px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; }
.btn:hover { filter: brightness(0.95); }
.btn:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.btn[disabled] { background: var(--line); border-color: var(--line); color: var(--muted); cursor: not-allowed; filter: none; }
.btn.ghost { background: transparent; color: var(--accent); border-color: var(--accent); }
.btn.ghost:hover { background: var(--accent-soft); filter: none; }
.btn.small { padding: 7px 14px; font-size: 14px; }

.result { padding: 20px; display: grid; gap: 14px; }
.result[hidden] { display: none; }
.rtop { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; }
.pill { display: inline-flex; font-weight: 700; font-size: 15px; padding: 3px 14px; border-radius: 99px; }
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.pill.no { background: var(--no-soft); color: var(--no); }
.pill.ask { background: var(--accent-soft); color: var(--accent); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 0; padding: 0; list-style: none; }
.chip { font-size: 13px; padding: 1px 10px; border: 1px solid var(--line); border-radius: 99px; color: var(--muted); }
.reasons { display: grid; gap: 8px; margin: 0; padding: 0; list-style: none; }
.reasons li { padding: 12px 14px; border-radius: 6px; background: var(--no-soft); color: var(--no); border: 1px solid var(--no-line); font-size: 14.5px; }
.okmsg { margin: 0; color: var(--muted); }
.askmsg { margin: 0; padding: 12px 14px; border-radius: 6px; background: var(--accent-soft); color: var(--accent); border: 1px solid var(--accent); font-size: 14.5px; font-weight: 500; }

dialog.notice { width: min(92vw, 420px); padding: 22px 20px 18px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--ink); }
dialog.notice::backdrop { background: rgba(10, 20, 30, 0.55); }
dialog.notice h3 { margin: 0 0 8px; font-size: 18px; }
dialog.notice p { margin: 0 0 18px; }
/* 진행 순서 체크리스트 */
.meter { display: grid; gap: 8px; padding-top: 16px; border-top: 1px solid var(--line); }
.mtop { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.mtop h3 { margin: 0; font-size: 17px; }
.mtop span { font-size: 14px; font-variant-numeric: tabular-nums; color: var(--muted); }
.mbar { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
.mbar > i { display: block; height: 100%; width: 0; background: var(--accent); transition: width 0.2s ease; }
.mnote { margin: 0; font-size: 13px; color: var(--muted); }
.sysnote { margin: 12px 0 0; padding: 10px 14px; border-radius: 8px; background: var(--accent-soft); color: var(--accent); font-size: 14px; font-weight: 700; }  
ol.steps { list-style: none; margin: 0; padding: 0; display: grid; }
li.step { position: relative; display: grid; grid-template-columns: 48px minmax(0, 1fr); gap: 14px; padding-block: 14px; }
li.step::before { content: ""; position: absolute; left: 23px; top: 62px; bottom: -14px; width: 2px; background: var(--line); }
li.step:last-child::before { display: none; }
.sbox { position: relative; width: 48px; height: 48px; z-index: 1; display: grid; place-items: center; }
.sbox input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; margin: 0; cursor: pointer; }
.dot { display: grid; place-items: center; width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--muted); background: var(--surface); font-family: var(--font-mono); font-size: 12px; color: var(--muted); }
.stamp { display: none; width: 48px; height: 48px; border-radius: 50%; }
.sbox:has(input:checked) .dot { display: none; }
.sbox:has(input:checked) .stamp { display: block; animation: stampIn 0.28s cubic-bezier(0.2, 0.9, 0.3, 1.3); }
@keyframes stampIn { from { transform: scale(1.6) rotate(-14deg); opacity: 0; } to { transform: none; opacity: 1; } }
.sbox:has(input:focus-visible) { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 50%; }
li.now .dot { border-color: var(--accent); color: var(--accent); }
.sbody { display: grid; gap: 6px; min-width: 0; }
.st-title { margin: 0; font-weight: 700; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; min-height: 48px; }
li.done .st-title { color: var(--muted); }
.now-tag { font-size: 12px; font-weight: 700; color: var(--accent); background: var(--tag-bg); border-radius: 4px; padding: 0 7px; }
.now-tag[hidden] { display: none; }
.st-desc { margin: 0; color: var(--muted); font-size: 14.5px; }
.st-actions { display: flex; flex-wrap: wrap; gap: 8px; }
a.btn { text-decoration: none; }
.fcard { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 16px; padding: 14px 16px; border: 1px solid var(--line); border-radius: 8px; background: var(--opt); }
.finfo { display: grid; gap: 2px; min-width: 0; flex: 1 1 220px; }
.finfo b { font-size: 16px; overflow-wrap: anywhere; }
.finfo span { font-size: 13px; color: var(--muted); }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(20px + env(safe-area-inset-bottom, 0px)); max-width: min(92vw, 460px); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 8px; font-size: 14px; z-index: 20; }
.toast[hidden] { display: none; }
.contact { display: grid; grid-template-columns: auto 1fr; gap: 2px 14px; margin: 0; padding: 12px 14px; border-radius: 6px; background: var(--accent-soft); font-size: 14.5px; }
.contact dt { color: var(--muted); }
.contact dd { margin: 0; font-weight: 700; overflow-wrap: anywhere; }
.contact a { color: var(--accent); text-decoration: none; }
.contact a:hover { text-decoration: underline; }
dialog.notice .contact { margin-bottom: 18px; }
dialog.notice .dact { display: flex; justify-content: flex-end; }

@media (max-width: 600px) {
  .bar-in { flex-wrap: wrap; row-gap: 10px; }
  .bar-link { margin-left: 0; width: 100%; justify-content: center; }
}
@media (max-width: 420px) {
  h1 { font-size: 24px; }
  fieldset, .result { padding-inline: 14px; }
  .actions { padding-inline: 14px; }
  .actions .btn, .fcard .btn { width: 100%; }
  .bar-name { font-size: 13px; }
  .opts { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .opts.one { grid-template-columns: minmax(0, 1fr); }
}
@media (prefers-reduced-motion: reduce) { .mark::after, .mbar > i { transition: none; } .stamp { animation: none !important; } }
.pill.ok { background: var(--tag-bg); color: var(--accent); }
.sys-btn { margin-top: 12px; justify-self: start; align-self: flex-start; width: fit-content; text-decoration: none; }
</style>

    { t: '3자 협약 (대학-기업-학생)' },
    { t: '산재보험가입증명서 제출 (실습 시작 후 일주일 이내)' },
    { t: '출근부, 평가표, 만족도조사 제출 (별도 안내)' }
  ];
}
function initialDone(a) { return stepsFor(a).map((_, i) => i === 0 && a.kind === 'existing'); }
function labelOf(qid, v) {
  const q = QUESTIONS.find(x => x.id === qid);
  const o = q && q.options.find(x => x.v === v);
  return o ? o.label : '';
}
/*PURE-END*/

const answers = { kind: null };
const $ = id => document.getElementById(id);

function renderQuestions() {
  $('questions').innerHTML = QUESTIONS.map((q, i) => {
    const opts = q.options.map(o => {
      const id = 'o-' + q.id + '-' + o.v;
      return '<label class="opt" for="' + id + '"><input type="radio" id="' + id + '" name="' + q.id + '" value="' + o.v + '">' +
        '<span class="mark" aria-hidden="true"></span><span class="olabel">' + o.label + '</span></label>';
    }).join('');
    return '<fieldset><legend><span class="qt">' + q.title + '</span></legend><div class="opts">' + opts + '</div></fieldset>';
  }).join('');
}
function updateProgress() {
  const n = QUESTIONS.filter(q => answers[q.id]).length;
  $('progress').textContent = n + ' / ' + QUESTIONS.length + ' 문항 응답';
  $('go').disabled = n < QUESTIONS.length;
}

const KEY = 'inu-company-v1';
let done = [];
function save() { try { localStorage.setItem(KEY, JSON.stringify({ a: answers, d: done })); } catch (e) {} }
function load() {
  try {
    const s = JSON.parse(localStorage.getItem(KEY) || 'null');
    if (!s || !s.a) return false;
    QUESTIONS.forEach(q => { if (q.options.some(o => o.v === s.a[q.id])) answers[q.id] = s.a[q.id]; });
    if (!answers.kind) return false;
    done = initialDone(answers);
    if (Array.isArray(s.d)) done.forEach((_, i) => { if (s.d[i]) done[i] = true; });
    return true;
  } catch (e) { return false; }
}
function applyAnswersToDom() { const el = $('o-kind-' + answers.kind); if (el) el.checked = true; }

function checklistHtml() {
  const items = stepsFor(answers).map((s, i) => {
    const extra = s.links ? '<div class="st-actions">' + s.links.map(l => '<a class="btn ghost small" href="' + l.href + '" target="_blank" rel="noopener">' + l.label + '</a>').join('') + '</div>' : '';
    return '<li class="step"><label class="sbox" for="st-' + i + '"><input type="checkbox" id="st-' + i + '" data-i="' + i + '" aria-label="' + (i + 1) + '단계 ' + s.t + ' 완료">' +
      '<span class="dot" aria-hidden="true"><span class="num">' + (i + 1) + '</span></span><img class="stamp" src="' + STAMP_SRC + '" alt="" aria-hidden="true"></label>' +
      '<div class="sbody"><p class="st-title">' + s.t + '<span class="now-tag" hidden>현재 단계</span></p>' + (s.d ? '<p class="st-desc">' + s.d + '</p>' : '') + extra + '</div></li>';
  }).join('');
  return '<div class="meter"><div class="mtop"><h3>진행 순서</h3><span id="count"></span></div>' +
    '<div class="mbar" role="presentation"><i id="mfill"></i></div><p class="mnote">아래 순서대로 진행하시고, 마친 단계는 체크해 주세요. 체크한 내용은 이 기기에 저장됩니다.</p>' +
        '<p class="sysnote">모든 절차는 현장실습 온라인 시스템에서 진행됩니다.</p>' +
    '<a class="btn sys-btn" href="' + SYSTEM_URL + '" target="_blank" rel="noopener">온라인 시스템 바로가기</a></div>' +
    '<ol class="steps">' + items + '</ol>';
}
function refreshChecklist() {
  const n = done.filter(Boolean).length;
  $('count').textContent = n + ' / ' + done.length + ' 완료';
  $('mfill').style.width = (n / done.length * 100) + '%';
  const next = done.indexOf(false);
  document.querySelectorAll('li.step').forEach((li, i) => {
    li.classList.toggle('done', done[i]);
    li.classList.toggle('now', i === next);
    li.querySelector('.now-tag').hidden = (i !== next);
  });
}

function showResult(focus) {
  if (done.length !== stepsFor(answers).length) done = initialDone(answers);
  const r = $('result');
  r.innerHTML = '<div class="rtop"><span class="pill ok">' + (answers.kind === 'new' ? '신규 기업 체크리스트' : '기존 기업 체크리스트') + '</span>' +
    '<button type="button" class="btn ghost small" id="edit">답변 수정</button></div>' +
    '' + checklistHtml();
  r.hidden = false;
  $('edit').addEventListener('click', () => { r.hidden = true; document.querySelector('#q input').focus(); window.scrollTo(0, 0); });
  document.querySelectorAll('input[data-i]').forEach(cb => {
    const i = +cb.dataset.i;
    cb.checked = done[i];
    cb.addEventListener('change', () => { done[i] = cb.checked; save(); refreshChecklist(); });
  });
  refreshChecklist();
  if (focus) { r.focus(); r.scrollIntoView({ behavior: 'smooth', block: 'nearest' }); }
}

renderQuestions();
if (load()) applyAnswersToDom();
updateProgress();
$('q').addEventListener('change', e => {
  const t = e.target;
  if (!t.name) return;
  answers[t.name] = t.value;
  done = initialDone(answers);   // 답을 바꾸면 체크 상태를 새로 시작합니다.
  $('result').hidden = true;
  updateProgress();
  save();
});
$('q').addEventListener('submit', e => { e.preventDefault(); showResult(true); });
if (QUESTIONS.every(q => answers[q.id])) showResult(false);
</script>

</html>
